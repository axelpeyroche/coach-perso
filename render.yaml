services:
  # L'API (coach-perso) a été supprimée de Render le 17/11/2026 : Mon Carnet tourne sur Northflank (Dockerfile).
  - type: web
    name: coach-perso-frontend
    runtime: static
    # Mon Carnet a déménagé sur Northflank (17/11/2026) : ce site ne sert plus qu'une page de redirection
    buildCommand: echo redirection
    staticPublishPath: frontend/redirection
    routes:
      - type: redirect
        source: /*
        destination: https://p01--mon-carnet--fqnw5psrcspx.code.run/*
    # En-têtes de sécurité (appliqués si le service est géré par ce blueprint)
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Content-Security-Policy
        value: "frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SPOTIFY_CLIENT_ID
        sync: false
