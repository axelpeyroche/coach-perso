# Synchro Intervals.icu chaque matin, même si le carnet n'est pas ouvert, puis notifications
# du jour (forme du matin + séance conseillée, alerte VFC, records battus).
# Secret à créer dans GitHub (Settings → Secrets and variables → Actions) :
#   CARNET_IMPORT_TOKEN = token de synchro (Sources → Intervals.icu → Synchro nocturne → « Configurer »)
name: Synchro du matin Intervals.icu

on:
  schedule:
    - cron: "47 5 * * *"   # 05:47 UTC = 7 h 47 en été, 6 h 47 en hiver (heure de Paris) : VFC de la nuit disponible
    # GitHub ne garantit pas les horaires planifiés (créneaux parfois sautés) : rattrapages,
    # ignorés si une synchro du jour a déjà réussi (pas de notification en double)
    - cron: "23 6 * * *"
    - cron: "7 7 * * *"
  workflow_dispatch:        # bouton « Run workflow » pour tester

permissions:
  actions: read   # lire les exécutions précédentes du jour

jobs:
  synchro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Déjà faite aujourd'hui ?
        id: deja
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list -R "$GITHUB_REPOSITORY" -w synchro-nocturne.yml -s success                 --created ">=$(date -u +%F)" --json databaseId --jq "map(select(.databaseId != $GITHUB_RUN_ID)) | length")
          echo "Synchros réussies aujourd'hui : $n"
          [ "$n" -gt 0 ] && echo "fait=1" >> "$GITHUB_OUTPUT" || true
      - name: Synchroniser
        if: steps.deja.outputs.fait != '1'
        env:
          TOKEN: ${{ secrets.CARNET_IMPORT_TOKEN }}
          API: https://coach-perso.onrender.com
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::Secret CARNET_IMPORT_TOKEN manquant"; exit 1; fi
          # Le serveur gratuit de Render dort : le premier appel le réveille (jusqu'à ~1 min)
          curl -s -o /dev/null --max-time 120 "$API/health" || true
          for essai in 1 2 3; do
            code=$(curl -s -o reponse.json -w "%{http_code}" --max-time 300 -X POST \
              -H "Authorization: Bearer $TOKEN" "$API/api/intervals/synchro-nuit" || echo 000)
            if [ "$code" = "200" ]; then
              jq '{nouvelles, completees, traces, mesures, forme_recue, notifications}' reponse.json
              exit 0
            fi
            echo "Essai $essai : HTTP $code — $(jq -r '.detail // empty' reponse.json 2>/dev/null)"
            if [ "$code" = "401" ] || [ "$code" = "409" ]; then exit 1; fi
            sleep 60
          done
          exit 1
