# Synchro Intervals.icu chaque matin, même si le carnet n'est pas ouvert, puis notifications
# du jour (forme du matin + séance conseillée, alerte VFC, records battus).
# Secret à créer dans GitHub (Settings → Secrets and variables → Actions) :
#   CARNET_IMPORT_TOKEN = token de synchro (Sources → Intervals.icu → Synchro nocturne → « Configurer »)
name: Synchro du matin Intervals.icu

on:
  schedule:
    # Toutes les 30 min de 03:20 à 10:50 UTC (5 h 20 → 12 h 50 à Paris selon la saison) : le serveur
    # envoie la notification une seule fois, au premier passage après l'heure choisie dans le profil
    # (Profil → Notifications → Heure d'envoi). GitHub peut retarder ou sauter un passage : le suivant rattrape.
    - cron: "20,50 3-10 * * *"
  workflow_dispatch:        # bouton « Run workflow » pour tester : notification envoyée tout de suite

jobs:
  synchro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Synchroniser
        env:
          TOKEN: ${{ secrets.CARNET_IMPORT_TOKEN }}
          API: https://coach-perso.onrender.com
          NOTIFIER: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::Secret CARNET_IMPORT_TOKEN manquant"; exit 1; fi
          # Le serveur gratuit de Render dort : le premier appel le réveille (jusqu'à ~1 min)
          curl -s -o /dev/null --max-time 120 "$API/health" || true
          for essai in 1 2 3; do
            code=$(curl -s -o reponse.json -w "%{http_code}" --max-time 300 -X POST \
              -H "Authorization: Bearer $TOKEN" "$API/api/intervals/synchro-nuit?notifier=$NOTIFIER" || echo 000)
            if [ "$code" = "200" ]; then
              jq '{nouvelles, completees, traces, mesures, forme_recue, notifications}' reponse.json
              exit 0
            fi
            echo "Essai $essai : HTTP $code — $(jq -r '.detail // empty' reponse.json 2>/dev/null)"
            if [ "$code" = "401" ] || [ "$code" = "409" ]; then exit 1; fi
            sleep 60
          done
          exit 1
